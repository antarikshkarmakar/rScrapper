[package]
name = "rscraper-mcp"
description = "Bounded MCP stdio server exposing rScrapper scrape and search tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rscraper-mcp"
path = "src/main.rs"

[dependencies]
rscraper-cli = { path = "../rscraper-cli" }
rscraper-core = { path = "../rscraper-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }

[lints]
workspace = true
