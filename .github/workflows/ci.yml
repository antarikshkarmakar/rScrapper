name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  stable:
    name: Stable release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      # This action caches Cargo registry/git data and target/ only. It does
      # not include state, cookies, reports, browser profiles, keys, or fixtures.
      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: stable
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test all targets and features
        run: cargo test --workspace --all-targets --all-features

      - name: Test public documentation
        run: cargo test --workspace --doc --all-features

      - name: Build public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Execute README contract
        run: cargo test --workspace readme -- --nocapture

      - name: Install pinned dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit --deny warnings

      - name: Build release artifacts
        run: cargo build --workspace --release --all-features

  msrv:
    name: Rust 1.88.0 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install exact MSRV
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.88.0

      - name: Cache MSRV build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: false
          shared-key: msrv-1.88.0
          workspaces: ". -> target"

      - name: Check locked workspace
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

      - name: Test locked workspace
        run: cargo +1.88.0 test --workspace --all-targets --all-features --locked

      - name: Test locked public documentation
        run: cargo +1.88.0 test --workspace --doc --all-features --locked

      - name: Build locked public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --workspace --all-features --no-deps --locked
